<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Job Aggregator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .hero-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5rem 0;
            text-align: center;
            border-bottom-left-radius: 50% 10%;
            border-bottom-right-radius: 50% 10%;
            margin-bottom: 3rem;
        }
        .search-card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="hero-banner">
        <div class="container">
            <h1 class="display-4 fw-bold">Intelligent Job Matcher</h1>
            <p class="lead">Find your ideal job based on AI skill matching.</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card search-card">
                    <div class="card-body p-5">
                        <h4 class="card-title text-center mb-4">Enter Your Profile</h4>
                        <form method="POST" action="/">
                            <div class="mb-3">
                                <label for="skills" class="form-label fw-bold">Skills (comma separated)</label>
                                <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g. Python, React, Machine Learning" required>
                            </div>
                            <div class="mb-3">
                                <label for="experience" class="form-label fw-bold">Experience / Role</label>
                                <input type="text" class="form-control" id="experience" name="experience" placeholder="e.g. 5 years senior backend developer">
                            </div>
                            <div class="mb-4">
                                <label for="location" class="form-label fw-bold">Preferred Location</label>
                                <input type="text" class="form-control" id="location" name="location" placeholder="e.g. Remote, San Francisco, New York">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" style="background: #764ba2; border: none;">Find Matching Jobs</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
